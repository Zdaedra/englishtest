# Hetzner IP deploy (raw IP:port, HTTP-only, behind Caddy basic_auth).
# app is NOT published directly — only reachable via english_caddy on the
# docker network. Caddy publishes the single custom host port.
#   docker compose -p english -f docker-compose.deploy.yml up -d --build
services:
  english_app:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    container_name: english_app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENGLISH_LLM_PROVIDER=${ENGLISH_LLM_PROVIDER:-auto}
      # Cookie auth gate (replaces Caddy basic-auth so iOS remembers login).
      - ENGLISH_APP_PASSWORD=${ENGLISH_APP_PASSWORD}
      - ENGLISH_COOKIE_SECRET=${ENGLISH_COOKIE_SECRET}
      # Apple IAP (StoreKit 2) — bundle id has a config default; these enable
      # transaction verification. Not secrets. Flip ENV to production at launch.
      - ENGLISH_APPLE_APP_APPLE_ID=${ENGLISH_APPLE_APP_APPLE_ID:-6782193688}
      - ENGLISH_APPLE_ENV=${ENGLISH_APPLE_ENV:-sandbox}
      # Email verification (Resend). Empty key => the verification gate stays
      # dormant (signups auto-verify); set RESEND_API_KEY on the host to activate.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - ENGLISH_PUBLIC_BASE_URL=${ENGLISH_PUBLIC_BASE_URL:-https://executive-english.net}
      # Stats cabinet (/admin) HTTP Basic credentials. Both must be set on the host
      # (.env) to enable it; empty => the cabinet returns 404 (fail-closed).
      - ENGLISH_STATS_USER=${ENGLISH_STATS_USER:-}
      - ENGLISH_STATS_PASSWORD=${ENGLISH_STATS_PASSWORD:-}
    volumes:
      - english_data:/srv/backend/data
    expose:
      - "8000"
    restart: unless-stopped

  english_caddy:
    image: caddy:2
    container_name: english_caddy
    depends_on: [english_app]
    ports:
      - "${ENGLISH_PORT:-8090}:80"
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - english_caddy_data:/data
      - english_caddy_config:/config
    restart: unless-stopped

volumes:
  english_data:
  english_caddy_data:
  english_caddy_config:
